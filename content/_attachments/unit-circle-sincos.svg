<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 340" font-family="sans-serif" font-size="15">
  <!-- axes -->
  <line x1="30" y1="170" x2="320" y2="170" stroke="#999" stroke-width="1"/>
  <line x1="170" y1="320" x2="170" y2="30" stroke="#999" stroke-width="1"/>
  <text x="324" y="174" fill="#999">x</text>
  <text x="160" y="28" fill="#999">y</text>

  <!-- unit circle -->
  <circle cx="170" cy="170" r="120" fill="none" stroke="#444" stroke-width="1.5"/>

  <!-- angle arc (theta) -->
  <path d="M 202 170 A 32 32 0 0 0 191.4 146.2" fill="none" stroke="#555" stroke-width="1.5"/>
  <text x="206" y="162" fill="#555">θ</text>

  <!-- cos projection: along x-axis (blue) -->
  <line x1="170" y1="170" x2="250.3" y2="170" stroke="#1f77b4" stroke-width="4"/>
  <!-- sin projection: vertical leg (red) -->
  <line x1="250.3" y1="170" x2="250.3" y2="80.8" stroke="#d62728" stroke-width="4"/>

  <!-- radius = 1 (dark) -->
  <line x1="170" y1="170" x2="250.3" y2="80.8" stroke="#333" stroke-width="2"/>

  <!-- point P -->
  <circle cx="250.3" cy="80.8" r="4.5" fill="#333"/>
  <text x="256" y="76" fill="#333">P = (cos θ, sin θ)</text>

  <!-- labels -->
  <text x="196" y="188" fill="#1f77b4">cos θ</text>
  <text x="256" y="130" fill="#d62728">sin θ</text>
  <text x="196" y="120" fill="#333" transform="rotate(-48 196 120)">1</text>
</svg>
