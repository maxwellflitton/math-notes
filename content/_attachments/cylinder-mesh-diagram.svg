<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" font-family="Georgia, 'Times New Roman', serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c2603a"/>
    </marker>
    <marker id="arrowdim" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7d8b99"/>
    </marker>
  </defs>

  <!-- ================= LEFT: the cylinder ================= -->

  <text x="40" y="40" font-size="19" fill="#7d8b99" font-style="italic">The cylinder</text>

  <!-- top ring -->
  <ellipse cx="185" cy="130" rx="95" ry="30"
           fill="none" stroke="#5f7b93" stroke-width="2.2"/>
  <!-- bottom ring: back half dashed, front half solid -->
  <path d="M 90 330 A 95 30 0 0 1 280 330"
        fill="none" stroke="#5f7b93" stroke-width="1.6" stroke-dasharray="5 5" opacity="0.65"/>
  <path d="M 90 330 A 95 30 0 0 0 280 330"
        fill="none" stroke="#5f7b93" stroke-width="2.2"/>
  <!-- silhouette -->
  <line x1="90" y1="130" x2="90" y2="330" stroke="#5f7b93" stroke-width="2.2"/>
  <line x1="280" y1="130" x2="280" y2="330" stroke="#5f7b93" stroke-width="2.2"/>

  <!-- a few ring vertices, bottom -->
  <circle cx="90"  cy="330" r="4.5" fill="#c2603a"/>
  <circle cx="152" cy="358" r="4.5" fill="#c2603a"/>
  <circle cx="228" cy="357" r="4.5" fill="#7d8b99"/>
  <circle cx="280" cy="330" r="4.5" fill="#7d8b99"/>
  <!-- matching vertices, top -->
  <circle cx="90"  cy="130" r="4.5" fill="#c2603a"/>
  <circle cx="152" cy="158" r="4.5" fill="#c2603a"/>

  <!-- the highlighted quad on the surface -->
  <path d="M 90 330 L 152 358 L 152 158 L 90 130 Z"
        fill="#c2603a" opacity="0.10"/>
  <line x1="90" y1="330" x2="152" y2="358" stroke="#c2603a" stroke-width="2"/>
  <line x1="90" y1="130" x2="152" y2="158" stroke="#c2603a" stroke-width="2"/>
  <line x1="90" y1="330" x2="90"  y2="130" stroke="#c2603a" stroke-width="2"/>
  <line x1="152" y1="358" x2="152" y2="158" stroke="#c2603a" stroke-width="2"/>
  <line x1="152" y1="358" x2="90"  y2="130" stroke="#c2603a" stroke-width="1.4" stroke-dasharray="4 4"/>

  <text x="60"  y="348" font-size="16" fill="#c2603a" font-style="italic">p</text>
  <text x="160" y="378" font-size="16" fill="#c2603a" font-style="italic">q</text>
  <text x="42"  y="126" font-size="16" fill="#c2603a" font-style="italic">p+n</text>
  <text x="160" y="152" font-size="16" fill="#c2603a" font-style="italic">q+n</text>

  <!-- radius -->
  <line x1="185" y1="130" x2="280" y2="130"
        stroke="#7d8b99" stroke-width="1.6" marker-end="url(#arrowdim)"/>
  <text x="222" y="120" font-size="16" fill="#7d8b99" font-style="italic">R</text>
  <circle cx="185" cy="130" r="3" fill="#7d8b99"/>

  <!-- axis -->
  <line x1="185" y1="330" x2="185" y2="132"
        stroke="#7d8b99" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrowdim)"/>
  <text x="196" y="240" font-size="16" fill="#7d8b99" font-style="italic">a</text>
  <line x1="196" y1="226" x2="207" y2="226" stroke="#7d8b99" stroke-width="1.3"/>

  <text x="290" y="336" font-size="14" fill="#7d8b99" font-style="italic">z = offset</text>
  <text x="290" y="136" font-size="14" fill="#7d8b99" font-style="italic">z = offset + |a|</text>

  <!-- ================= RIGHT: the unrolled quad ================= -->

  <text x="470" y="40" font-size="19" fill="#7d8b99" font-style="italic">One quad, unrolled</text>

  <!-- two triangles -->
  <path d="M 530 340 L 780 340 L 530 140 Z" fill="#c2603a" opacity="0.09"/>
  <path d="M 780 340 L 780 140 L 530 140 Z" fill="#5f7b93" opacity="0.09"/>

  <!-- rim -->
  <line x1="530" y1="340" x2="780" y2="340" stroke="#5f7b93" stroke-width="2.2"/>
  <line x1="530" y1="140" x2="780" y2="140" stroke="#5f7b93" stroke-width="2.2"/>
  <line x1="530" y1="340" x2="530" y2="140" stroke="#5f7b93" stroke-width="2.2"/>
  <line x1="780" y1="340" x2="780" y2="140" stroke="#5f7b93" stroke-width="2.2"/>
  <!-- diagonal -->
  <line x1="780" y1="340" x2="530" y2="140" stroke="#c2603a" stroke-width="2.2"/>

  <circle cx="530" cy="340" r="5" fill="#c2603a"/>
  <circle cx="780" cy="340" r="5" fill="#c2603a"/>
  <circle cx="530" cy="140" r="5" fill="#c2603a"/>
  <circle cx="780" cy="140" r="5" fill="#c2603a"/>

  <text x="500" y="366" font-size="16" fill="#333f4a" font-style="italic">p</text>
  <text x="786" y="366" font-size="16" fill="#333f4a" font-style="italic">q</text>
  <text x="486" y="134" font-size="16" fill="#333f4a" font-style="italic">p+n</text>
  <text x="786" y="134" font-size="16" fill="#333f4a" font-style="italic">q+n</text>

  <text x="590" y="300" font-size="15" fill="#c2603a">(p, q, p+n)</text>
  <text x="660" y="196" font-size="15" fill="#5f7b93">(q, q+n, p+n)</text>

  <!-- winding arrows -->
  <path d="M 604 316 A 34 34 0 1 1 616 300"
        fill="none" stroke="#c2603a" stroke-width="1.6" marker-end="url(#arrow)" opacity="0.9"/>
  <path d="M 706 182 A 34 34 0 1 1 694 198"
        fill="none" stroke="#5f7b93" stroke-width="1.6" marker-end="url(#arrowdim)" opacity="0.9"/>

  <!-- edge annotations -->
  <text x="614" y="362" font-size="13" fill="#7d8b99" font-style="italic">bottom ring</text>
  <text x="624" y="130" font-size="13" fill="#7d8b99" font-style="italic">top ring</text>
  <text x="440" y="244" font-size="13" fill="#7d8b99" font-style="italic">vertical</text>
  <text x="792" y="244" font-size="13" fill="#7d8b99" font-style="italic">vertical</text>
  <text x="600" y="248" font-size="13" fill="#c2603a" font-style="italic" transform="rotate(-38 600 248)">diagonal</text>

  <text x="470" y="416" font-size="14" fill="#7d8b99" font-style="italic">
    q = (p+1) mod n  —  the wrap that closes the tube
  </text>

</svg>
